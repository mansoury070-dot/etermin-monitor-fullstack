services:
  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    restart: unless-stopped

  redis-ui:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped

  backend:
    build: 
      context: ./fast_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TZ=Europe/Berlin
    depends_on:
      - redis
    restart: unless-stopped
  
  worker:
    build: 
      context: ./fast_api
    command: python worker/scheduler.py
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    restart: unless-stopped

  sync-job:
    build: 
      context: ./fast_api
    command: python services/daily_sync_job.py
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: 
      context: ./front_end
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
    restart: unless-stopped